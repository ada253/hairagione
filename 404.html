<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata – HaiRagione</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f4fd8">
<link rel="icon" type="image/png" sizes="192x192" href="/hairagione/icon-192.png">
<style>
  :root { --bg:#f6f7fb; --surface:#fff; --text:#141a2b; --muted:#5b6478; --border:#e2e6ef; --primary:#1f4fd8; --primary-ink:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1320; --surface:#171c2c; --text:#e9ecf4; --muted:#9aa3b8; --border:#283049; --primary:#6b8cff; --primary-ink:#0f1320; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; line-height:1.6; padding:16px; }
  .box { max-width:460px; text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:32px 22px; }
  .logo { font-weight:800; font-size:1.2rem; letter-spacing:-.02em; }
  .logo span { color:var(--primary); }
  h1 { font-size:1.5rem; margin:18px 0 8px; }
  p { color:var(--muted); margin:0 0 22px; }
  a.btn { display:inline-block; background:var(--primary); color:var(--primary-ink); text-decoration:none; font-weight:700; border-radius:10px; padding:12px 20px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Hai<span>Ragione</span></div>
    <h1>Pagina non trovata</h1>
    <p>Il link che hai seguito non esiste o è stato spostato.</p>
    <a class="btn" href="/hairagione/">Vai al controllo multa</a>
  </div>
</body>
</html>
